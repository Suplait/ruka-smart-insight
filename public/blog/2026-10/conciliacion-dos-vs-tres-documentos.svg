<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">La recepción cambia la pregunta.</title><desc id="desc">10 cajas pedidas frente a 8 cajas recibidas. 10 cajas facturadas frente a 2 cajas por aclarar. Lo acordado coincide frente a Falta respaldo de entrega</desc>
<rect width="1200" height="630" fill="#f5f6fc"/>
<text x="60" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4f5ce7">Ruka · Guía práctica</text>
<text x="60" y="133" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#171827">La recepción cambia la pregunta.</text>
<rect x="60" y="178" width="510" height="338" rx="12" fill="white"/>
<rect x="630" y="178" width="510" height="338" rx="12" fill="#171827"/>
<g font-family="Arial,sans-serif"><text x="90" y="226" font-size="23" font-weight="700" fill="#505b70">ORDEN + FACTURA</text><text x="660" y="226" font-size="23" font-weight="700" fill="#bfc6ff">+ RECEPCIÓN</text>
<text x="90" y="296" font-size="29" fill="#171827">10 cajas pedidas</text><text x="660" y="296" font-size="29" fill="#ffffff">8 cajas recibidas</text><path d="M90 318H540 M660 318H1110" stroke="#8a94b0" stroke-opacity=".25"/>
<text x="90" y="378" font-size="29" fill="#171827">10 cajas facturadas</text><text x="660" y="378" font-size="29" fill="#ffffff">2 cajas por aclarar</text><path d="M90 400H540 M660 400H1110" stroke="#8a94b0" stroke-opacity=".25"/>
<text x="90" y="460" font-size="29" fill="#171827">Lo acordado coincide</text><text x="660" y="460" font-size="29" fill="#ffffff">Falta respaldo de entrega</text>
<text x="60" y="573" font-size="23" fill="#505b70">Ejemplo ficticio. Una coincidencia no autoriza el pago.</text></g></svg>
