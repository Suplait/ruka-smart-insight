<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada | Ruka.ai</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fbfcff; color: #171827; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 48px 24px; }
      article { width: min(760px, 100%); padding: 72px 0; border-block: 1px solid #cbd3e2; text-align: center; }
      img { width: auto; height: 36px; }
      .eyebrow { margin: 48px 0 0; color: #4e66e9; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 20px 0 0; font-size: clamp(48px, 9vw, 76px); line-height: .98; letter-spacing: -.045em; }
      .copy { max-width: 520px; margin: 24px auto 0; color: #5b6275; font-size: 18px; line-height: 1.75; }
      a.button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 40px; border-radius: 999px; background: #4e66e9; color: white; padding: 0 24px; font-size: 14px; font-weight: 700; text-decoration: none; }
      a.button:focus-visible { outline: 3px solid rgba(78, 102, 233, .35); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <article>
        <a href="/" aria-label="Ir al inicio de Ruka"><img src="/logo.png" alt="Ruka.ai" /></a>
        <p class="eyebrow">Error 404</p>
        <h1>Esta página no existe.</h1>
        <p class="copy">La dirección puede haber cambiado o el enlace está incompleto.</p>
        <a class="button" href="/">Volver al inicio</a>
      </article>
    </main>
  </body>
</html>
